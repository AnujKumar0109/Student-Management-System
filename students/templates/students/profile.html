<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      .profile-card {
        width: 450px;
        border: none;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }

      .profile-header {
        background: #0d6efd;
        color: white;
        text-align: center;
        padding: 30px;
      }

      .profile-icon {
        width: 90px;
        height: 90px;
        background: white;
        color: #0d6efd;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: auto;
        font-size: 45px;
      }

      .profile-body {
        padding: 30px;
      }

      .profile-item {
        padding: 12px 0;
        border-bottom: 1px solid #eee;
      }

      .profile-item:last-child {
        border-bottom: none;
      }

      .profile-label {
        font-size: 13px;
        color: #6c757d;
      }

      .profile-value {
        font-size: 17px;
        font-weight: 500;
      }

      .btn-logout {
        background: #dc3545;
        color: white;
        font-weight: bold;
      }

      .btn-logout:hover {
        background: #bb2d3b;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="card profile-card">
      <!-- Profile Header -->

      <div class="profile-header">
        <div class="profile-icon">
          <i class="bi bi-person-fill"></i>
        </div>

        <h3 class="mt-3 mb-1">My Profile</h3>

        <p class="mb-0">Student Management System</p>
      </div>

      <!-- Profile Body -->

      <div class="profile-body">
        <!-- Username -->

        <div class="profile-item">
          <div class="profile-label">Username</div>

          <div class="profile-value">
            <i class="bi bi-person-fill text-primary"></i>
            {{ user.username }}
          </div>
        </div>

        <!-- Email -->

        <div class="profile-item">
          <div class="profile-label">Email Address</div>

          <div class="profile-value">
            <i class="bi bi-envelope-fill text-primary"></i>

            {% if user.email %}
                {{ user.email }} 
            {% else %} 
                No email added 
            {% endif %}
          </div>
        </div>

        <!-- Date Joined -->

        <div class="profile-item">
          <div class="profile-label">Account Created</div>

          <div class="profile-value">
            <i class="bi bi-calendar-check-fill text-primary"></i>

            {{ user.date_joined|date:"d M Y" }}
          </div>
        </div>

        <!-- Buttons -->
         {% if user.is_staff %}

<a
    href="{% url 'host_dashboard' %}"
    class="btn btn-dark w-100 mb-2"
    >
    <i class="bi bi-shield-lock-fill"></i>
    Host Dashboard
     </a>

     {% endif %}



        <div class="mt-4">
          <a href="{% url 'student_list' %}" class="btn btn-primary w-100 mb-2">
            <i class="bi bi-arrow-left"></i>

            Back to Students
          </a>

          <a href="{% url 'logout' %}" class="btn btn-logout w-100">
            <i class="bi bi-box-arrow-right"></i>

            Logout
          </a>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
