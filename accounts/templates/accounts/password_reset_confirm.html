<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Set New Password</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        font-family: Arial, sans-serif;
      }

      .reset-card {
        width: 400px;

        border: none;

        border-radius: 20px;

        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);

        overflow: hidden;
      }

      .reset-header {
        background: #0d6efd;

        color: white;

        padding: 25px;

        text-align: center;
      }

      .reset-header i {
        font-size: 55px;
      }

      .btn-reset {
        background: #0d6efd;

        color: white;

        font-weight: bold;
      }

      .btn-reset:hover {
        background: #0b5ed7;

        color: white;
      }

      .errorlist {
        color: #dc3545;

        font-size: 14px;
      }

      .form-control {
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="card reset-card">
      <div class="reset-header">
        <i class="bi bi-shield-lock-fill"></i>

        <h3 class="mt-3">Set New Password</h3>

        <p class="mb-0">Create your new password</p>
      </div>

      <div class="card-body p-4">
        {% if validlink %}

        <p class="text-muted text-center">Enter your new password below.</p>

        <form method="POST">
          {% csrf_token %} {{ form.as_p }}

          <button type="submit" class="btn btn-reset w-100 mt-3">
            <i class="bi bi-check-circle-fill"></i>

            Change Password
          </button>
        </form>

        {% else %}

        <div class="alert alert-danger text-center">
          <i class="bi bi-exclamation-triangle-fill"></i>

          <p class="mb-0 mt-2">
            This password reset link is invalid or has expired.
          </p>
        </div>

        <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">
          Request New Reset Link
        </a>

        {% endif %}
      </div>
    </div>
  </body>
</html>
