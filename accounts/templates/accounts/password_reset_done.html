<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Reset Email Sent</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        font-family: Arial, sans-serif;
      }

      .reset-card {
        width: 400px;

        border: none;

        border-radius: 20px;

        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);

        overflow: hidden;
      }

      .reset-header {
        background: #0d6efd;

        color: white;

        padding: 25px;

        text-align: center;
      }

      .reset-header i {
        font-size: 55px;
      }

      .btn-login {
        background: #0d6efd;

        color: white;

        font-weight: bold;
      }

      .btn-login:hover {
        background: #0b5ed7;

        color: white;
      }
    </style>
  </head>

  <body>
    <div class="card reset-card">
      <div class="reset-header">
        <i class="bi bi-envelope-check-fill"></i>

        <h3 class="mt-3">Check Your Email</h3>

        <p class="mb-0">Password Reset Link Sent</p>
      </div>

      <div class="card-body p-4 text-center">
        <p class="text-muted">
          If an account exists with the email address you entered, you will
          receive a password reset link shortly.
        </p>

        <p class="text-muted">
          Check your terminal window for the password reset link.
        </p>

        <a href="{% url 'login' %}" class="btn btn-login w-100 mt-3">
          <i class="bi bi-box-arrow-in-right"></i>

          Back to Login
        </a>
      </div>
    </div>
  </body>
</html>
