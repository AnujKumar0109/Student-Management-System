<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Management System - Sign Up</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        padding: 10px;
      }

      .signup-card {
        width: 400px;
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .signup-header {
        background: #0d6efd;
        color: white;
        border-radius: 20px 20px 0 0;
        padding: 15px;
        text-align: center;
      }

      .signup-header i {
        font-size: 45px;
      }

      .signup-header h3 {
        margin-top: 5px !important;
        margin-bottom: 2px;
      }

      .card-body {
        padding: 20px !important;
      }

      .form-label {
        margin-bottom: 4px;
      }

      .mb-3 {
        margin-bottom: 10px !important;
      }

      .mb-4 {
        margin-bottom: 15px !important;
      }

      .btn-signup {
        background: #0d6efd;
        color: white;
        font-weight: bold;
      }

      .btn-signup:hover {
        background: #0b5ed7;
        color: white;
      }

      @media (max-height: 650px) {
        .signup-header {
          padding: 10px;
        }

        .signup-header i {
          font-size: 35px;
        }

        .signup-header h3 {
          font-size: 20px;
        }

        .card-body {
          padding: 15px !important;
        }

        .mb-3 {
          margin-bottom: 7px !important;
        }

        .mb-4 {
          margin-bottom: 10px !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="card signup-card">
      <!-- Header -->
      <div class="signup-header">
        <i class="bi bi-mortarboard-fill"></i>

        <h3 class="mt-3">Student Management System</h3>

        <p class="mb-0">Create Your Account</p>
      </div>

      <!-- Signup Form -->
      <div class="card-body p-4">
        {% if messages %} {% for message in messages %}

        <div class="alert alert-danger py-2 mb-2">{{ message }}</div>

        {% endfor %} {% endif %}

        <form method="POST">
          {% csrf_token %}

          <!-- Username -->
          <div class="mb-3">
            <label class="form-label"> Username </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
              </span>

              <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter Username"
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label"> Email </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-envelope-fill"></i>
              </span>

              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter Email"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label"> Password </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>

              <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                required
              />
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-4">
            <label class="form-label"> Confirm Password </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>

              <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm Password"
                required
              />
            </div>
          </div>

          <!-- Signup Button -->
          <button type="submit" class="btn btn-signup w-100">
            <i class="bi bi-person-plus-fill"></i>

            Sign Up
          </button>

          <!-- Login Link -->
          <p class="text-center mb-0 mt-2">
            Already have an account?

            <a href="{% url 'login' %}" class="text-decoration-none"> Login </a>
          </p>
        </form>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
