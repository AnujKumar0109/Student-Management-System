<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>
</head>
<body>

<h2>Delete Student</h2>

<p>Are you sure you want to delete <strong>{{ object.first_name }} {{ object.last_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'student_detail' object.pk %}">Cancel</a>
</form>

</body>
</html>
